# BloodBridge Backend Test Configuration

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate create schema for tests (no Flyway)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT test configuration
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1ibG9vZGJyaWRnZS1hcHBsaWNhdGlvbi10aGF0LWlzLWxvbmctZW5vdWdo
app.jwt.expiration-ms=86400000

# CORS test configuration
app.cors.allowed-origins=http://localhost:3000

# Actuator
management.endpoints.web.exposure.include=health
