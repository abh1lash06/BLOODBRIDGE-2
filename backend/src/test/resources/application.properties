# Spring Boot Test Configuration (H2 in PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:bloodbridge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway disabled by default in standard unit/integration tests (Hibernate manages test schema)
spring.flyway.enabled=false

# JWT configuration for tests
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1ibG9vZGJyaWRnZS1hcHBsaWNhdGlvbi10aGF0LWlzLWxvbmctZW5vdWdo
app.jwt.expiration-ms=86400000

# CORS configuration for tests
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
